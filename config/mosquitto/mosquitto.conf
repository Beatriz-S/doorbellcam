# Mosquitto MQTT Broker Configuration

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Security - IMPORTANT: Change this for production!
# For initial setup, allow anonymous connections
allow_anonymous true

# For production, uncomment these lines and create password file:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# 
# To create password file, run:
# docker exec -it mqtt mosquitto_passwd -c /mosquitto/config/passwd your_username

# Connection settings
max_connections -1
max_keepalive 65535
