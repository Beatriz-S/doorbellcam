# MediaMTX configuration for USB Camera

# RTSP server settings
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889

# Authentication (optional - uncomment to enable)
# authMethod: internal
# authInternalUsers:
#   - user: doorbell
#     pass: your_password_here

# Performance settings for low latency
readTimeout: 10s
writeTimeout: 10s
readBufferCount: 256  # Reduced buffer for lower latency

# Path configuration
paths:
  camera:
    # USB Camera via FFmpeg - Optimized for low latency
    source: publisher
    sourceOnDemand: yes
    runOnInit: >
      ffmpeg -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 15 
      -i /dev/video0 -c:v libx264 -preset ultrafast -tune zerolatency 
      -profile:v baseline -level 3.1 -g 15 -keyint_min 15 -sc_threshold 0
      -b:v 1000k -maxrate 1000k -bufsize 500k -probesize 32 -analyzeduration 0
      -fflags nobuffer -flags low_delay -strict experimental
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
