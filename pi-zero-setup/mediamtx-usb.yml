# MediaMTX configuration for USB Camera
# TESTED AND WORKING on Raspberry Pi Zero 2 W with 5MP USB Camera

# RTSP server settings
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889

# Performance settings
readTimeout: 10s
writeTimeout: 10s
readBufferCount: 512

# Logging
logLevel: info

# Path configuration
paths:
  camera:
    # USB Camera via FFmpeg - Software encoding with libx264
    # Resolution: 1280x720 @ 15fps
    # Note: Uses libx264 software encoding (more reliable than h264_v4l2m2m)
    runOnInit: ffmpeg -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 15 -i /dev/video0 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 1000k -f rtsp rtsp://localhost:8554/camera
    runOnInitRestart: yes
